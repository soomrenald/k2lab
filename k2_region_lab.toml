# K2 Region Lab application configuration.
# Relative paths are resolved from this file. Environment variables documented
# in README.md override these values.

[paths]
comfyui_root = "~/ComfyUI"
# "auto" checks common CUDA and ROCm ComfyUI environments. Set an exact path
# when more than one GPU-enabled environment exists.
worker_python = "auto"
data_directory = "~/.local/share/k2-region-lab"
output_directory = "outputs"
diffusion_models = "~/ComfyUI/models/diffusion_models"
text_encoders = "~/ComfyUI/models/text_encoders"
vae = "~/ComfyUI/models/vae"
loras = "~/ComfyUI/models/loras"
upscale_models = "~/ComfyUI/models/upscale_models"

[models]
# Leave a value empty to use name-based auto-discovery in the directory above.
diffusion_model = ""
text_encoder = ""
vae = ""
face_detector = ""
upscale_model = ""

[runtime]
auto_start_worker = true
memory_policy = "safe_16gb"
reserve_vram_gb = 4.0
minimum_system_ram_gb = 14.0
cpu_vae = false
oom_recovery = true

[generation]
width = 1024
height = 1024
steps = 8
sampler = "euler"
scheduler = "simple"
seed = 0
seed_mode = "fixed"
filename_prefix = "baseline"
